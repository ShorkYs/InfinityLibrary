world: "InfinityLibrary"
start-location:
  x: 0
  y: 80
  z: 0
  yaw: 0
  pitch: 0
proximity-radius: 9.0
generation:
  schema: 4
  mode: district
  # Whole connected future layouts, bounded to avoid unbounded server work.
  district:
    rooms: 12
    depth: 6
    beam-width: 4
    search-states: 768
    alternatives-per-template: 4
  # Library structures are read-only for players; builders retain edit access.
  protect-structures: true
  max-rooms-per-tick: 1
  # Recheck explorers even when they stand still after construction/teleport.
  exploration-check-interval-ticks: 5
  # 0 means unlimited; placement waits for the current room to finish.
  max-total-rooms: 0
  placement-blocks-per-tick: 1800
  retry-room-selection: 16
  planning:
    # Search neighboring room exits together before placing rooms.
    neighborhood-radius: 48
    seed: 20261120
    search-nodes: 512
    beam-width: 12
    # Retained alternatives PER TEMPLATE per door, so every eligible room is considered.
    candidates-per-door: 12
    topology-choices-per-room: 64
    connection-check-budget: 200000
    max-doors: 16
    world-block-budget: 1000000
  start-room-id: "builtin_start"
  # Empty string restores mixed room-template selection.
  base-room-id: ""
  sign-min-rooms: 6
  # Proven unfillable openings are replaced on their own room boundary.
  # /il reopendeadends restores them. Base/catalog changes reopen automatically.
  path-blocking:
    enabled: true
    material: "SMOOTH_STONE"
    # Optional full block state overrides material, e.g. minecraft:oak_planks
    # block-data: "minecraft:stone_bricks"
gui:
  title: "&5Infinity Library"
  size: 27
  total-books-slot: 11
  contributors-slot: 13
  player-stats-slot: 15
  filler-material: "BLACK_STAINED_GLASS_PANE"
  total-books-material: "WRITTEN_BOOK"
  contributors-material: "PLAYER_HEAD"
  player-stats-material: "BOOK"
lectern-gui:
  title: "&5Library Lectern"
  book-editor-title: "&5Library Book Editor"
  save-shelf-radius: 16

bookshelf-return-gui:
  title: "&5Return Library Book"

rooms:
  max-capture-volume: 100000

props:
  packing-attempts: 8
  # Per-area collision/support cell checks, shared across attempts; capped at 1,000,000.
  cell-check-budget: 200000

community:
  max-shared-drafts-per-owner: 10
  notice-max-days: 30
  notice-limit: 200
navigation:
  max-active-routes: 32
  max-graph-rooms: 5000
  nodes-per-tick: 600
  max-search-nodes: 10000
  segment-range: 96
preview:
  max-volume: 32768
  duration-seconds: 90
  max-distance: 80

bookshelves:
  # Only loaded chunks are inspected; existing occupied slots are never replaced.
  chunks-per-tick: 1
  shelves-per-pass: 8

rentals:
  duration-hours: 168

builder:
  # Compatibility only. The server-side menus and wands need no client mod.
  legacy-companion-enabled: false
